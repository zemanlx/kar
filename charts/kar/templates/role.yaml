apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kar.labels" . | nindent 4 }}
rules:
  # create cannot be limited by resourceNames.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kar.zeman.dev"]
    verbs: ["get", "update"]
