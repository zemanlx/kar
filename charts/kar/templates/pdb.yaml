apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kar.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "kar.selectorLabels" . | nindent 6 }}
