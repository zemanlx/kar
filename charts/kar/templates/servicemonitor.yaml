{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: "monitoring.coreos.com/v1"
kind: ServiceMonitor
metadata:
  name: {{ include "kar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kar.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "kar.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # kar_violations uses namespace for the violating object. honorLabels keeps it;
      # the scrape default replaces it with the pod namespace.
      honorLabels: true
{{- end }}
