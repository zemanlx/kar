{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kar.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kar.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
{{- end }}
