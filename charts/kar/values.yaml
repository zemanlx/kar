image:
  repository: ghcr.io/zemanlx/kar
  tag: ""          # empty means .Chart.AppVersion
  pullPolicy: IfNotPresent
replicas: 3
defaultTTL: 192h
rbac:
  create: true       # false binds rbac.clusterRoleName and does not create a ClusterRole
  clusterRoleName: "" # empty uses the release name; required when create is false
  rules: []          # replaces get/list/watch on every resource; write rules stay when create is true
resources:          # 100k Pods / 4000 namespaces peaked at 234 MiB RSS; see README "Sizing"
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 512Mi
metrics:
  serviceMonitor:
    enabled: false   # creates a Service on port 8080 and a ServiceMonitor; needs the monitoring.coreos.com CRD
    labels: {}       # extra labels on the ServiceMonitor, for a Prometheus or VMAgent selector
