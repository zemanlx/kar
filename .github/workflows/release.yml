# Publishes the image to ghcr.io/zemanlx/kar and the chart to oci://ghcr.io/zemanlx/charts/kar for a vX.Y.Z tag,
# with build provenance attestations, then creates the GitHub release.
name: Release

on:
    push:
        tags: ["v*"]

permissions: {}

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/kar
    CHARTS: ghcr.io/${{ github.repository_owner }}/charts

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write # the GitHub release
            packages: write # image and chart in GHCR
            id-token: write # attestation signing
            attestations: write
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The chart's default image tag is its appVersion, so a mismatch would ship a chart that pulls the wrong image.
            - name: Check the tag matches the chart
              id: version
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  chart="$(yq '.version' charts/kar/Chart.yaml)"
                  app="$(yq '.appVersion' charts/kar/Chart.yaml)"
                  if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
                      echo "tag $GITHUB_REF_NAME needs Chart.yaml version and appVersion $version, got $chart and $app" >&2
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - id: image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.image.outputs.digest }}
                  push-to-registry: true

            - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
              with:
                  version: v3.20.2

            - name: Push the chart
              id: chart
              run: |
                  echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
                  helm package charts/kar --destination dist
                  helm push "dist/kar-${{ steps.version.outputs.version }}.tgz" "oci://$CHARTS" 2>&1 | tee push.log
                  echo "digest=$(grep -o 'sha256:[0-9a-f]*' push.log)" >> "$GITHUB_OUTPUT"

            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ${{ env.CHARTS }}/kar
                  subject-digest: ${{ steps.chart.outputs.digest }}
                  push-to-registry: true

            # The OCI attestation above covers the registry manifest, not the .tgz bytes a release asset downloads.
            - id: chart-file-attest
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: dist/kar-${{ steps.version.outputs.version }}.tgz

            # A release published in the UI creates the tag that starts this run, so it may already exist.
            # Scorecard's Signed-Releases check looks for a release asset ending in .intoto.jsonl.
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUNDLE: ${{ steps.chart-file-attest.outputs.bundle-path }}
              run: |
                  chart="dist/kar-${{ steps.version.outputs.version }}.tgz"
                  provenance="$chart.intoto.jsonl"
                  cp "$BUNDLE" "$provenance"
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      gh release upload "$GITHUB_REF_NAME" "$chart" "$provenance" --clobber
                      exit 0
                  fi
                  prerelease=""
                  case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
                  gh release create "$GITHUB_REF_NAME" "$chart" "$provenance" --verify-tag --generate-notes $prerelease

    verify:
        name: Verify
        needs: release
        permissions:
            contents: read
        uses: ./.github/workflows/verify-release.yml
        with:
            version: ${{ needs.release.outputs.version }}
