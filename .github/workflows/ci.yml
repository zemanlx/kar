# Unit tests, the envtest suite, the kind end-to-end suite, and golangci-lint.
# Load tests (`go test -tags load`) stay local.
name: CI

on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: Test (Kubernetes ${{ matrix.envtest }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                envtest: ["1.36.2", "1.37.0"]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Install envtest binaries
              run: |
                  go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
                  echo "KUBEBUILDER_ASSETS=$(setup-envtest use ${{ matrix.envtest }} -p path)" >> "$GITHUB_ENV"

            - name: Run tests
              run: go test -count=1 -timeout 20m -v -coverpkg=./... -coverprofile=cover.out ./...

            - name: Coverage summary
              if: matrix.envtest == '1.37.0'
              run: hack/coverage-summary.sh cover.out >> "$GITHUB_STEP_SUMMARY"

    e2e:
        name: E2E (Kubernetes ${{ matrix.k8s }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                k8s: ["1.36", "1.37"] # the versions hack/e2e.sh pins a node image for
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
              with:
                  version: v3.20.2

            - name: Run end-to-end tests
              env:
                  K8S_VERSION: ${{ matrix.k8s }}
              run: hack/e2e.sh

            - name: Upload e2e logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-logs-${{ matrix.k8s }}
                  path: bin/e2e-logs/
                  if-no-files-found: ignore

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Check generated code is up to date
              run: |
                  go generate ./...
                  if [ -n "$(git status --porcelain)" ]; then
                      git status --porcelain
                      git diff
                      echo "generated code is stale: run go generate ./... and commit the result" >&2
                      exit 1
                  fi

            - name: GolangCI-Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.15.0
                  install-mode: goinstall
                  # Skip the network schema fetch, which flakes on runners.
                  # `golangci-lint run` still validates the config at runtime.
                  verify: false
                  args: --timeout=5m

            # Uses the binary the action above go-installed into GOPATH/bin, which setup-go puts on PATH.
            - name: Check formatting
              run: golangci-lint fmt --diff
