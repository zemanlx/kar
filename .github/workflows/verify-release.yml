# Runs the e2e suite against a published release: the chart from GHCR, which pulls its image from GHCR.
name: Verify release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Released version, without the v (e.g. 0.1.0)
                required: true
    workflow_call:
        inputs:
            version:
                required: true
                type: string

permissions:
    contents: read

jobs:
    e2e:
        name: E2E ${{ inputs.version }} (Kubernetes ${{ matrix.k8s }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                k8s: ["1.36", "1.37"] # the versions hack/e2e.sh pins a node image for
        steps:
            # The suite comes from the triggering ref: the tag when release.yml calls this, the chosen branch when run by hand.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
              with:
                  version: v3.20.2

            - name: Run end-to-end tests
              env:
                  K8S_VERSION: ${{ matrix.k8s }}
                  KAR_VERSION: ${{ inputs.version }}
              run: hack/e2e.sh

            - name: Upload e2e logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-logs-${{ inputs.version }}-${{ matrix.k8s }}
                  path: bin/e2e-logs/
                  if-no-files-found: ignore
